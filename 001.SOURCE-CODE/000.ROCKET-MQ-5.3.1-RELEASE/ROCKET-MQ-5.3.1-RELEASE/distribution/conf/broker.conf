# ============================================================================
# RocketMQ Broker 配置文件（完整版，带详细注释）
# 版本：RocketMQ 5.3.1
# ============================================================================

# ============================================================================
# 1. 集群与Broker基础配置（BrokerConfig）
# ============================================================================

# 所属集群名称
brokerClusterName = DefaultCluster

# Broker 名称，主从同步时 Slave 需与 Master 保持一致
brokerName = broker-a

# Broker ID，0 表示 Master，大于 0 表示 Slave
brokerId = 0

# Broker 监听端口
listenPort = 6888

# Broker 对外的 IP 地址，多网卡时需要手动指定
# brokerIP1 = 127.0.0.1

# HA 复用端口绑定的 IP 地址，通常与 brokerIP1 相同
# brokerIP2 = 127.0.0.1

# NameServer 地址（多个用分号隔开）
# 也可以在启动时通过 -c 参数指定
# namesrvAddr = 192.168.1.1:9876;192.168.1.2:9876

# Broker 权限（PERM_READ=4, PERM_WRITE=2, PERM_READ|PERM_WRITE=6）
# brokerPermission = 6

# 默认 Topic 的队列数，当自动创建 Topic 时使用
defaultTopicQueueNums = 8

# 是否允许自动创建 Topic
autoCreateTopicEnable = true

# 是否允许自动创建订阅组
autoCreateSubscriptionGroup = true

# 集群主题是否开启（可用 CLUSTER 前缀访问）
clusterTopicEnable = true

# Broker 主题是否开启（可用 BROKER 前缀访问）
brokerTopicEnable = true

# 消息追踪主题名称
# msgTraceTopicName = RMQ_SYS_TRACE_TOPIC

# 是否开启消息追踪
# traceTopicEnable = false

# 是否启用长轮询（默认开启）
longPollingEnable = true

# 短轮询间隔时间（毫秒）
shortPollingTimeMills = 1000

# 是否开启高速模式
# highSpeedMode = false

# 是否开启从节点可读（建议开启，可分担读压力）
slaveReadEnable = false

# 是否启用网络流控
# enableNetWorkFlowControl = false

# Pop 模式消费轮询大小
# popPollingSize = 1024

# 广播消费偏移量存储开关
# enableBroadcastOffsetStore = true

# 注册到 NameServer 的间隔（毫秒）
registerNameServerPeriod = 30000

# Broker 心跳间隔（毫秒）
brokerHeartbeatInterval = 1000

# 是否开启 ACL（访问控制列表）
# 需要在 broker.conf 中显式配置，同时需要安装 ACL 插件
# accessKey = RocketMQ
# secretKey = 12345678

# ============================================================================
# 2. 消息存储配置（MessageStoreConfig）
# ============================================================================

# 存储根目录（所有消息数据的根路径）
storePathRootDir = /Users/store

# CommitLog 存储目录（默认在 storePathRootDir 下）
# storePathCommitLog = /Users/store/commitlog

# ConsumeQueue 存储目录（默认在 storePathRootDir 下）
# storePathConsumeQueue = /Users/store/consumequeue

# 索引文件存储目录（默认在 storePathRootDir 下）
# storePathIndex = /Users/store/index

# CommitLog 文件大小（默认 1GB）
# mappedFileSizeCommitLog = 1073741824

# ConsumeQueue 文件大小（默认 300000 个条目）
# mappedFileSizeConsumeQueue = 6000000

# TimerLog 文件大小（默认 100MB），定时消息使用
# mappedFileSizeTimerLog = 104857600

# 是否开启异步刷盘（true=异步刷盘，false=同步刷盘）
flushDiskType = ASYNC_FLUSH

# 同步刷盘超时时间（毫秒）
# syncFlushTimeout = 5000

# 异步刷盘间隔（毫秒），仅 flushCommitLogTimed=true 时有效
# flushIntervalCommitLog = 500

# 是否定时刷盘（true=按时间间隔刷盘，false=按页数刷盘）
# flushCommitLogTimed = true

# 刷盘最少页数（4KB/页）
# flushCommitLogLeastPages = 4

# 强制刷盘间隔（毫秒），超过此间隔即使未达最少页数也刷盘
# flushCommitLogThoroughInterval = 10000

# ConsumeQueue 刷盘间隔（毫秒）
# flushIntervalConsumeQueue = 1000

# ConsumeQueue 刷盘最少页数
# flushConsumeQueueLeastPages = 2

# 消息最大大小（字节，默认 4MB）
# maxMessageSize = 4194304

# 消息存储最大超时时间（毫秒）
# putMessageTimeout = 8000

# 是否启用消息索引
# messageIndexEnable = true

# 索引 Hash 槽数量
# maxHashSlotNum = 5000000

# 索引最大数量
# maxIndexNum = 20000000

# 是否启用瞬态存储池（使用堆外内存提升写入性能）
# transientStorePoolEnable = false

# 瞬态存储池大小（文件数）
# transientStorePoolSize = 5

# 主从同步端口
# haListenPort = 10912

# Master 地址（Slave 需要配置）
# haMasterAddress = 192.168.1.1:10912

# 主从同步最大差距（超过此值认为 Slave 落后）
# haMaxGapNotInSync = 268435456

# 文件保留时间（小时），超过此时间的文件会被删除
fileReservedTime = 48

# 删除文件的时间点（24小时制，如 04 表示凌晨4点）
deleteWhen = 04

# 删除文件间隔（毫秒）
# deleteCommitLogFilesInterval = 100

# 磁盘空间使用率告警阈值（百分比）
# diskSpaceWarningLevelRatio = 90

# 磁盘空间强制清理阈值（百分比）
# diskSpaceCleanForciblyRatio = 85

# 磁盘最大使用率，超过此值禁止写入
# diskMaxUsedSpaceRatio = 75

# Broker 角色（ASYNC_MASTER/SYNC_MASTER/SLAVE）
brokerRole = ASYNC_MASTER

# 是否开启重复检测（去重功能）
# duplicationEnable = false

# 是否启用日志压缩
# enableCompaction = true

# 是否启用多级存储（5.1+ 新特性）
# enableMultiDispatch = false

# ============================================================================
# 3. 传统延迟级别消息配置（ScheduleMessageService）
# 参考：ScheduleMessageService.java
# ============================================================================

# 延迟级别定义，格式：空格分隔的"数字+单位"列表
# 单位：s=秒，m=分，h=时
# Level 1~18 分别对应数组中的第1~18个值
# 注意：不支持自定义添加，只能在18个级别中选择
messageDelayLevel = 1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h

# 延迟偏移量持久化间隔（毫秒）
# flushDelayOffsetInterval = 10000

# 是否启用调度消息统计
# enableScheduleMessageStats = true

# 是否启用异步投递（减少阻塞，提高吞吐量）
# enableScheduleAsyncDeliver = false

# 异步投递最大待处理数（超过此值触发流控）
# scheduleAsyncDeliverMaxPendingLimit = 2000

# 异步投递最大重试次数，超过则阻塞
# scheduleAsyncDeliverMaxResendNum2Blocked = 3

# ============================================================================
# 4. 定时消息（Timer Message / 时间轮）配置（TimerMessageStore）
# 参考：TimerMessageStore.java, TimerWheel.java, TimerLog.java
# 说明：RocketMQ 5.0+ 新特性，支持毫秒级精确延迟
# ============================================================================

# 是否启用时间轮（定时消息功能）
# 开启后，生产者可使用 setDeliverTimeMs() / setDelayTimeSec() 设置精确延迟
# timerWheelEnable = true

# 时间轮精度（毫秒），可选值：1000, 500, 200, 100
# 精度越高，延迟越精确，但 CPU 和内存开销也越大
# 默认 1000ms（秒级精度）
# timerPrecisionMs = 1000

# 最大延迟时间（秒），默认 3 天（259200秒）
# 超过此值的定时消息会被拒绝
# timerMaxDelaySec = 259200

# 滚动窗口槽位数（默认 2 天 = 172800 个槽位）
# 延迟时间超过此值的消息会被标记为 MAGIC_ROLL，分多次滚动投递
# timerRollWindowSlot = 172800

# TimerLog 刷盘间隔（毫秒）
# timerFlushIntervalMs = 1000

# 出队获取消息线程数（从 CommitLog 读取消息体）
# timerGetMessageThreadNum = 3

# 出队写入消息线程数（将到期消息写回 CommitLog）
# timerPutMessageThreadNum = 3

# 是否使用 Disruptor 队列（提升入队/出队性能）
# timerEnableDisruptor = false

# 是否启用指标检查（定期校正定时消息统计）
# timerEnableCheckMetrics = true

# 指标检查时间（cron 表达式中的分钟部分，如 "05" 表示每小时第5分钟）
# timerCheckMetricsWhen = 05

# 指标小阈值，小于此值的 topic 指标会被重新计算
# timerMetricSmallThreshold = 1000000

# 进度日志输出间隔（毫秒）
# timerProgressLogIntervalMs = 10000

# 是否拦截延迟级别消息（由时间轮接管传统延迟消息）
# 设为 true 时，setDelayTimeLevel() 也会走时间轮路径
# timerInterceptDelayLevel = false

# 停止入队（调试用，设为 true 时不再处理新的定时消息）
# timerStopEnqueue = false

# 停止出队（调试用，设为 true 时不再投递到期的定时消息）
# timerStopDequeue = false

# 遇到未知错误是否跳过（设为 true 可能导致消息丢失，慎用）
# timerSkipUnknownError = false

# 是否启用预热（出队前预读取数据到 page cache）
# timerWarmEnable = false

# 每个时间槽位的拥塞阈值（超过此值触发随机拒绝）
# 默认 Integer.MAX_VALUE，即不限制
# timerCongestNumEachSlot = 2147483647

# 启动后隐藏时间（毫秒），在这段时间内 Broker 不对外提供服务
# 用于等待时间轮初始化完成。-1 表示不启用
# disappearTimeAfterStart = -1

# ============================================================================
# 5. 线程池配置（BrokerConfig）
# ============================================================================

# 发送消息线程数（默认 min(CPU核数, 4)）
# sendMessageThreadPoolNums = 4

# 拉取消息线程数（默认 16 + CPU核数 * 2）
# pullMessageThreadPoolNums = 24

# 管理员操作线程数
# adminBrokerThreadPoolNums = 16

# 客户端管理线程数
# clientManageThreadPoolNums = 32

# 消费者管理线程数
# consumerManageThreadPoolNums = 32

# 心跳线程数
# heartbeatThreadPoolNums = 4

# ============================================================================
# 6. 消费相关配置
# ============================================================================

# 是否开启消费者偏移量持久化
# flushConsumerOffsetInterval = 5000

# 消费者落后阈值（字节），超过此值停止消费
# consumerFallbehindThreshold = 17179869184

# 是否禁用消费慢的消费者
# disableConsumeIfConsumerReadSlowly = false

# 是否开启广播模式偏移量存储
# enableBroadcastOffsetStore = true

# Pop 模式配置
# 轮询大小
# popPollingSize = 1024
# 复活检查间隔（毫秒）
# reviveInterval = 1000
# 复活队列数
# reviveQueueNum = 8

# 消息拉取模式（PULL / POP）
# defaultMessageRequestMode = PULL

# 是否启用 LitePull 消息模式
# litePullMessageEnable = true

# ============================================================================
# 7. 网络与性能优化配置
# ============================================================================

# 是否启用快速失败（线程池队列满时快速返回失败）
# brokerFastFailureEnable = true

# 发送消息队列等待超时（毫秒）
# waitTimeMillsInSendQueue = 200

# 拉取消息队列等待超时（毫秒）
# waitTimeMillsInPullQueue = 5000

# 是否使用堆外内存传输消息（减少 GC）
# transferMsgByHeap = true

# 内存中消息最大传输字节数
# maxTransferBytesOnMessageInMemory = 262144

# 内存中消息最大传输条数
# maxTransferCountOnMessageInMemory = 32

# 磁盘中消息最大传输字节数
# maxTransferBytesOnMessageInDisk = 65536

# 磁盘中消息最大传输条数
# maxTransferCountOnMessageInDisk = 8

# 内存访问消息比例（百分比），超过此值从磁盘读取
# accessMessageInMemoryMaxRatio = 40

# ============================================================================
# 8. 存储类型配置（5.1+ 多级存储）
# ============================================================================

# 存储类型：DEFAULT（默认）或 RocksDB
# storeType = DEFAULT

# 是否将元数据迁移到 RocksDB（仅 storeType=RocksDB 时有效）
# transferMetadataJsonToRocksdb = false

# ============================================================================
# 9. 日志配置
# ============================================================================

# 是否开启消息追踪
# traceOn = true

# 消息追踪 Topic
# msgTraceTopicName = RMQ_SYS_TRACE_TOPIC

# ============================================================================
# 10. 其他配置
# ============================================================================

# 是否启用批量推送
# enableBatchPush = false

# 是否启用 LMQ（轻量消息队列）
# enableLmq = false

# 最大 LMQ ConsumeQueue 数量
# maxLmqConsumeQueueNum = 20000

# 是否允许并发恢复
# recoverConcurrently = false

# 是否启用属性过滤
# enablePropertyFilter = false

# 是否压缩注册信息
# compressedRegister = false

# 是否强制注册
# forceRegister = true

# 是否启用消费者组变更通知
# notifyConsumerIdsChangedEnable = true

# 是否启用 ACL
# 需要配合 rocketmq-acl 插件使用
# accessKey = RocketMQ
# secretKey = 12345678